<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SafeLoop — From SOS to Safe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0F19;--bg2:#0D1322;--surface:#111A2C;--surface2:#16223A;--surface3:#1C2B48;
  --line:#223252;--line2:#2C3F66;
  --text:#E9EFFA;--muted:#93A2C0;--faint:#5C6D8E;
  --red:#FF4D5E;--orange:#FF9A3D;--yellow:#FFC94D;--blue:#4D9FFF;--green:#2FD6A3;--teal:#2FD6C4;
  --r:14px;--shadow:0 14px 40px -14px rgba(0,0,0,.55);
  --font:'Inter',system-ui,sans-serif;--disp:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);font-weight:700;line-height:1.15;letter-spacing:-.01em}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
::selection{background:rgba(77,159,255,.3)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}::-webkit-scrollbar-track{background:transparent}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:border-color .2s,transform .2s,box-shadow .2s}
.card.hov:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:600;font-size:14px;cursor:pointer;transition:all .18s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--line2);background:var(--surface3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#06101F}
.btn-primary:hover{background:#66AEFF;border-color:#66AEFF}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#FF6B79;border-color:#FF6B79}
.btn-green{background:var(--green);border-color:var(--green);color:#05221A}
.btn-green:hover{background:#4EE2B5;border-color:#4EE2B5}
.btn-ghost{background:transparent}
.btn.lg{padding:14px 24px;font-size:15.5px;border-radius:12px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn-ic{padding:9px;border-radius:10px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.05em;border:1px solid;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-red{color:#FF8A94;border-color:rgba(255,77,94,.45);background:rgba(255,77,94,.1)}
.b-orange{color:#FFB877;border-color:rgba(255,154,61,.45);background:rgba(255,154,61,.1)}
.b-yellow{color:#FFE094;border-color:rgba(255,201,77,.4);background:rgba(255,201,77,.08)}
.b-blue{color:#8FC3FF;border-color:rgba(77,159,255,.45);background:rgba(77,159,255,.1)}
.b-green{color:#7AE8C6;border-color:rgba(47,214,163,.45);background:rgba(47,214,163,.1)}
.b-teal{color:#7AE8DD;border-color:rgba(47,214,196,.4);background:rgba(47,214,196,.08)}
.b-muted{color:var(--muted);border-color:var(--line);background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:12.5px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.4)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .ic{width:52px;height:52px;border-radius:14px;border:1px dashed var(--line2);display:grid;place-items:center;margin:0 auto 14px;color:var(--faint)}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.land{min-height:100vh}
.land-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;background:rgba(10,15,25,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:19px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--green);flex:none}
.land-links{display:flex;gap:26px;color:var(--muted);font-size:14px;font-weight:500}
.land-links span{cursor:pointer;transition:color .15s}
.land-links span:hover{color:var(--text)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:72px 5vw 60px;max-width:1280px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--green);border:1px solid rgba(47,214,163,.35);background:rgba(47,214,163,.06);padding:7px 14px;border-radius:99px;margin-bottom:26px}
.hero-badge i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:softPulse 2s infinite}
h1.hero-h{font-size:clamp(46px,6.4vw,84px);letter-spacing:-.03em}
h1.hero-h em{font-style:normal;color:var(--green)}
.hero-sub{font-size:19px;color:var(--text);margin:22px 0 10px;font-weight:500;max-width:520px}
.hero-support{color:var(--muted);max-width:540px;margin-bottom:32px}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.hero-meta{font-size:11px;letter-spacing:.12em;color:var(--faint)}
.hero-viz{display:flex;justify-content:center}
#hubSvg{width:100%;max-width:560px}
.loopRing{transform-box:fill-box;transform-origin:center}
section.land-sec{padding:72px 5vw;max-width:1200px;margin:0 auto;border-top:1px solid var(--line)}
.sec-kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--red);margin-bottom:12px}
.sec-kicker.ok{color:var(--green)}
.sec-title{font-size:clamp(26px,3.4vw,38px);margin-bottom:14px;max-width:640px}
.sec-sub{color:var(--muted);max-width:640px;margin-bottom:38px}
.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.chain-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 14px;position:relative;text-align:center}
.chain-item .cn{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.12em}
.chain-item .ct{font-weight:700;font-size:14.5px;margin-top:6px}
.chain-item .ci{width:38px;height:38px;margin:0 auto 10px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line2);color:var(--muted)}
.chain.broken .chain-item{border-color:rgba(255,77,94,.28)}
.chain.broken .chain-item .ci{color:#FF8A94;border-color:rgba(255,77,94,.35);background:rgba(255,77,94,.07)}
.chain.okc .chain-item .ci{color:#7AE8C6;border-color:rgba(47,214,163,.35);background:rgba(47,214,163,.06)}
.chain.okc .chain-item{border-color:rgba(47,214,163,.22)}
.chain-conn{position:absolute;right:-11px;top:50%;transform:translateY(-50%);color:var(--faint);z-index:2}
.chain.broken .chain-conn{color:rgba(255,77,94,.5)}
.chain.okc .chain-conn{color:var(--green)}
.usp-band{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:48px;display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;margin-top:52px;position:relative;overflow:hidden}
.loop-visual{width:180px;height:180px;position:relative;display:grid;place-items:center}
.loop-visual svg{position:absolute;inset:0;width:100%;height:100%}
.loop-word{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--green)}
.usp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:36px}
.usp-point{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px}
.usp-point b{display:block;margin-bottom:6px;font-size:14.5px}
.usp-point span{color:var(--muted);font-size:13px}
.cycle{display:flex;gap:0;overflow-x:auto;padding:8px 2px 16px}
.cycle-step{flex:1;min-width:150px;position:relative;padding:16px 14px 16px 22px;background:var(--bg2);border:1px solid var(--line);border-right:0}
.cycle-step:first-child{border-radius:12px 0 0 12px}.cycle-step:last-child{border-radius:0 12px 12px 0;border-right:1px solid var(--line)}
.cycle-step::after{content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%) rotate(45deg);width:12px;height:12px;background:var(--bg2);border-top:1px solid var(--line);border-right:1px solid var(--line);z-index:2}
.cycle-step:last-child::after{display:none}
.cycle-step .cn{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.1em}
.cycle-step .ct{font-weight:700;font-size:13px;margin-top:4px}
.stake-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stake{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center}
.stake .si{width:40px;height:40px;margin:0 auto 10px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line2)}
.stake b{font-size:13px;display:block}
.stake span{font-size:11.5px;color:var(--faint)}
.footer-land{border-top:1px solid var(--line);padding:40px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
@keyframes softPulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes mkPulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.3);opacity:0}}

.shell{display:grid;grid-template-columns:242px 1fr;height:100vh}
.sidebar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.sidebar .brand{padding:4px 8px 18px}
.nav-sec{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--faint);padding:14px 10px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all .15s}
.nav-item:hover{color:var(--text);background:var(--surface)}
.nav-item.active{color:var(--text);background:var(--surface2);border-color:var(--line)}
.nav-item .nv{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.nav-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:10px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(13,19,34,.7);backdrop-filter:blur(8px)}
.topbar .pg{font-family:var(--disp);font-weight:600;font-size:16.5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-clock{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:softPulse 1.8s infinite}
.bell-btn{position:relative}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.hamb{display:none}
.content{flex:1;overflow-y:auto;padding:24px 26px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-size:23px}
.page-head .sub{color:var(--muted);font-size:13.5px;margin-top:4px}

.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.metrics.m4{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;gap:13px;align-items:center;padding:16px}
.stat-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line2);flex:none}
.c-red{color:var(--red);background:rgba(255,77,94,.09)}
.c-orange{color:var(--orange);background:rgba(255,154,61,.09)}
.c-yellow{color:var(--yellow);background:rgba(255,201,77,.08)}
.c-blue{color:var(--blue);background:rgba(77,159,255,.09)}
.c-green{color:var(--green);background:rgba(47,214,163,.09)}
.c-teal{color:var(--teal);background:rgba(47,214,196,.08)}
.stat-v{font-family:var(--disp);font-size:27px;font-weight:700;line-height:1.1}
.stat-l{font-size:10.5px;letter-spacing:.1em;color:var(--faint);margin-top:3px}
.dash-grid{display:grid;grid-template-columns:280px 1fr 340px;gap:14px;align-items:start}
.col-stack{display:flex;flex-direction:column;gap:14px}
.mini-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:12px}
.pmix-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.pmix-row .pl{width:64px;color:var(--muted)}
.pmix-row .bar{flex:1}
.pmix-row .pv{font-family:var(--mono);font-size:12px;width:20px;text-align:right}

.opmap{position:relative;background:#0C1322;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:460px}
.opmap .maptop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);z-index:6;background:linear-gradient(rgba(12,19,34,.9),rgba(12,19,34,0))}
.opmap .gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(77,159,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(77,159,255,.05) 1px,transparent 1px);background-size:44px 44px}
.opmap .river{position:absolute;inset:0;width:100%;height:100%}
.map-zone{position:absolute;border:1px dashed;border-radius:10px;display:flex;align-items:flex-start;padding:7px 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;z-index:1;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;z-index:3;display:grid;place-items:center;padding:0}
.mk .dot{width:13px;height:13px;border-radius:50%;transition:transform .2s}
.mk.inc .dot.crit{background:var(--red);box-shadow:0 0 0 4px rgba(255,77,94,.15)}
.mk.inc .dot.high{background:var(--orange)}
.mk.inc .dot.med{background:var(--yellow)}
.mk.inc .dot.low{background:var(--blue)}
.mk.inc.crit::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid var(--red);animation:mkPulse 2.2s ease-out infinite}
.mk .mlab{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;color:var(--text);background:rgba(10,15,25,.85);border:1px solid var(--line);padding:2px 6px;border-radius:6px;white-space:nowrap}
.mk.team .dot{background:var(--blue);border-radius:3px;transform:rotate(45deg);box-shadow:0 0 0 3px rgba(77,159,255,.14)}
.mk.shelt .dot{background:var(--green);border-radius:4px;box-shadow:0 0 0 3px rgba(47,214,163,.14)}
.mk:hover .dot{transform:scale(1.35)}
.mk.team:hover .dot{transform:rotate(45deg) scale(1.3)}
.mk.sel{z-index:5}
.mk.sel .dot{outline:2px solid #fff;outline-offset:2px}
.map-legend{position:absolute;left:12px;bottom:12px;z-index:6;display:flex;gap:12px;flex-wrap:wrap;background:rgba(10,15,25,.85);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--muted)}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.queue-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;cursor:pointer;background:var(--bg2);transition:all .15s}
.queue-item:hover{border-color:var(--line2);transform:translateY(-1px)}
.queue-item.sel{border-color:var(--blue);background:rgba(77,159,255,.06)}
.queue-item .qid{font-family:var(--mono);font-size:12px;font-weight:600}
.queue-item .ql{font-size:12.5px;color:var(--muted);margin-top:2px}
.queue-item .qs{font-family:var(--mono);font-size:16px;font-weight:600}
.act-feed .af-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
.act-feed .af-item:last-child{border:0}
.af-t{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;width:44px}
.af-id{font-family:var(--mono);font-size:11px;color:var(--blue);flex:none}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface3);border-color:var(--line2);color:var(--text)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.inp,select.inp,textarea.inp{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--blue)}
select.inp{cursor:pointer}
.tb-wrap{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;min-width:820px}
.tb th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:500}
.tb td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
.tb tbody tr{cursor:pointer;transition:background .12s}
.tb tbody tr:hover{background:rgba(77,159,255,.05)}

.tl{position:relative;padding-left:24px}
.tl::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 12px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface3);border:2px solid var(--line2)}
.tl-item.hl::before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px rgba(77,159,255,.15)}
.tl-item .tt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tl-item .tl-t{font-size:13.5px;margin-top:1px}
.stages{display:flex;flex-direction:column;gap:0}
.stage{display:flex;gap:16px;position:relative;padding-bottom:26px}
.stage:last-child{padding-bottom:0}
.stage .sd{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;background:var(--bg2);color:transparent;z-index:2}
.stage::before{content:'';position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage.done .sd{background:var(--green);border-color:var(--green);color:#05221A}
.stage.done::before{background:var(--green)}
.stage.cur .sd{border-color:var(--blue);color:var(--blue);animation:softPulse 1.6s infinite;box-shadow:0 0 0 5px rgba(77,159,255,.12)}
.stage.cur::before{background:linear-gradient(var(--blue),var(--line))}
.stage .sl{font-weight:600;font-size:15px;padding-top:2px}
.stage.cur .sl{color:var(--blue)}

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hydrate(inc){
  if(inc.score==null||isNaN(inc.score)){
    const d={type:inc.type,people:inc.people||1,injury:inc.injuries,danger:inc.danger,trapped:inc.trapped,vulnerable:inc.vulnerable};
    inc.score=calcPriority(d).score;
  }
  inc.priority=classOf(inc.score);
  if(!Array.isArray(inc.resources))inc.resources=[];
  if(!Array.isArray(inc.timeline))inc.timeline=[];
}
function normalize(s){(s.incidents||[]).forEach(hydrate);if(!Array.isArray(s.allocLog))s.allocLog=[];if(!Array.isArray(s.myRequests))s.myRequests=[];}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.v===3){p.demo.running=false;normalize(p);return p;}}}catch(e){}
  const d=DEFAULT();normalize(d);return d;
}

/* ---------------- DOMAIN LOGIC ---------------- */
const classOf=s=>s>=76?'CRITICAL':s>=56?'HIGH':s>=31?'MEDIUM':'LOW';
function calcPriority(d){
  const f=[['Base report',18]];
  const tw={'Medical Emergency':14,'Trapped / Rescue Required':24,'Flood':14,'Fire':20,'Earthquake Damage':17,'Landslide':13,'Other':4};
  f.push(['Disaster type: '+d.type,tw[d.type]??4]);
  const inj=d.injuries??d.injury??'none';
  const iw={severe:['Severe injury reported',20],moderate:['Moderate injury reported',10],minor:['Minor injuries only',4],none:['No injuries reported',0]};
  f.push(iw[inj]||iw.none);
  const dw={extreme:['Immediate life-threatening danger',20],high:['High danger level',13],moderate:['Moderate danger level',7],low:['Low danger level',2]};
  f.push(dw[d.danger]||dw.low);
  if(d.trapped)f.push(['People trapped on scene',12]);
  if(d.vulnerable)f.push(['Vulnerable individuals present',8]);
  f.push([(d.people||1)+' people affected',Math.min(14,Math.ceil((+d.people||1)/2)*2)]);
  const score=clamp(f.reduce((a,x)=>a+x[1],0),5,100);
  return {score,factors:f};
}
function insights(d,score){
  const o=[];
  if(d.danger==='extreme')o.push('Immediate life-threatening danger reported');
  if(d.trapped)o.push('People trapped — extraction required');
  if((d.injuries||d.injury)==='severe')o.push('Severe medical condition reported');
  if(d.vulnerable)o.push('Vulnerable individuals involved (children / elderly)');
  if((d.people||1)>=5)o.push('Multiple people affected ('+d.people+')');
  if(['Flood','Fire','Earthquake Damage','Landslide'].includes(d.type))o.push('High-risk disaster type: '+d.type);
  if(score>=56)o.push('Report aging in queue — response window narrowing');
  if(!o.length)o.push('Standard assistance request — no immediate life threat');
  return o;
}
const getInc=id=>S.incidents.find(i=>i.id===id);
const getTeam=id=>S.teams.find(t=>t.id===id);
const getShelter=id=>S.shelters.find(x=>x.id===id);
const shelterStatus=sh=>{const p=sh.occ/sh.cap*100;return p>=100?'FULL':p>=80?'NEAR FULL':p>=55?'LIMITED CAPACITY':'AVAILABLE';};
const resStatus=r=>r.available<r.crit?'CRITICAL':r.available<r.crit*2?'LOW':'SUFFICIENT';
const activeIncs=()=>S.incidents.filter(i=>i.status!=='RESOLVED');
function nextStatus(inc){
  if(inc.status==='RESCUE IN PROGRESS')return inc.shelter?'EVACUATED':'RESOLVED';
  return FLOW[Math.min(FLOW.indexOf(inc.status)+1,FLOW.length-1)];
}
function pushTL(inc,label){inc.timeline.push({ts:Date.now(),label});}
function notif(type,title,msg){
  S.notifications.unshift({id:'N'+Date.now()+Math.floor(Math.random()*99),type,title,msg,ts:Date.now(),read:false});
  if(S.notifications.length>40)S.notifications.length=40;
  save();
}
function createIncident(d,opts={}){
  const id='DM-'+(S.seq++);
  const {score}=calcPriority(d);
  const inc={id,type:d.type,location:d.location,x:d.x||clamp(20+Math.random()*60,15,85),y:d.y||clamp(18+Math.random()*60,15,85),
    people:+d.people||1,injuries:d.injuries||'none',danger:d.danger||'low',trapped:!!d.trapped,vulnerable:!!d.vulnerable,
    desc:d.desc||'',name:d.name||'Citizen',contact:d.contact||'—',reportedAt:Date.now(),status:'RECEIVED',
    team:null,shelter:null,joined:0,resources:[],priority:classOf(score),score,
    timeline:[{ts:Date.now(),label:'Emergency reported via citizen '+(d.mode==='report'?'report':'SOS')}]};
  S.incidents.unshift(inc);
  if(opts.mine!==false)S.myRequests.unshift(id);
  notif(score>=76?'critical':'info','New '+classOf(score)+' emergency reported',id+' — '+d.type+' at '+d.location+'.');
  save();return inc;
}
function assignTeam(incId,teamId){
  const inc=getInc(incId),t=getTeam(teamId);if(!inc||!t)return;
  inc.team=teamId;inc.status='TEAM ASSIGNED';t.avail='DEPLOYED';t.mission=incId;
  pushTL(inc,t.name+' assigned');
  notif('info','Response team assigned',t.name+' deployed to '+incId+'.');
  save();
}
function citizenMsg(st,inc){
  return {'UNDER REVIEW':'Your request is now under review by the command center.','PRIORITY ASSESSED':'Priority confirmed: '+inc.priority+'. You are in the response queue.','TEAM ASSIGNED':(getTeam(inc.team)?.name||'A response team')+' has been assigned to you.','EN ROUTE':'Your response team is en route. Stay where you are if safe to do so.','RESCUE IN PROGRESS':'Rescue operation is in progress at your location.','EVACUATED':'You have been evacuated to '+(getShelter(inc.shelter)?.name||'a shelter')+'.','RESOLVED':'You are safe. Your request has been resolved.'}[st]||('Status changed to '+st+'.');
}
function setStatus(incId,st){
  const inc=getInc(incId);if(!inc||inc.status===st)return;
  inc.status=st;pushTL(inc,STATUS_TL[st]||('Status changed to '+st));
  if(st==='RESOLVED'){
    if(inc.team){const t=getTeam(inc.team);if(t){t.avail='AVAILABLE';t.mission=null;}}
    S.resolvedToday++;S.week[6]++;
    notif('success','Incident resolved',incId+' closed. Response loop complete — team released.');
  }else{
    const kind=st==='EN ROUTE'||st==='RESCUE IN PROGRESS'?'info':st==='EVACUATED'?'success':'info';
    notif(kind,'Request '+incId+' updated',citizenMsg(st,inc));
  }
  save();
}
function allocateResource(incId,resId,qty){
  const r=S.resources.find(x=>x.id===resId),inc=getInc(incId);if(!r||!inc||qty<1)return false;
  qty=Math.min(qty,r.available);if(qty<1)return false;
  r.available-=qty;r.allocated+=qty;
  inc.resources.push({name:r.name,qty,unit:r.unit});
  pushTL(inc,qty+' '+r.unit+' '+r.name+' allocated');
  S.allocLog.unshift({ts:Date.now(),txt:qty+' '+r.unit+' '+r.name+' → '+incId});
  if(S.allocLog.length>30)S.allocLog.length=30;
  notif('info','Resources allocated',qty+' '+r.unit+' of '+r.name+' sent to '+incId+'.');
  if(resStatus(r)!=='SUFFICIENT')notif('warn','Resource inventory '+resStatus(r).toLowerCase(),r.name+' available: '+r.available+' '+r.unit+'.');
  save();return true;
}
function assignEvacuees(shelterId,n,incId){
  const sh=getShelter(shelterId);if(!sh||n<1)return false;
  if(sh.occ+n>sh.cap){toast('Not enough space — only '+(sh.cap-sh.occ)+' places free.','t-red');return false;}
  sh.occ+=n;
  if(incId){const inc=getInc(incId);if(inc){inc.shelter=shelterId;pushTL(inc,n+' evacuees moved to '+sh.name);}}
  const st=shelterStatus(sh);
  notif(st==='NEAR FULL'||st==='FULL'?'warn':'success','Shelter occupancy updated',sh.name+' now at '+sh.occ+'/'+sh.cap+' ('+st+').');
  save();return true;
}
function joinResponse(volId,incId){
  const v=S.volunteers.find(x=>x.id===volId),inc=getInc(incId);if(!v||!inc||v.avail!=='AVAILABLE')return false;
  v.avail='ASSIGNED';v.incident=incId;inc.joined=(inc.joined||0)+1;
  pushTL(inc,'Volunteer '+v.name+' joined response');
  notif('success','Volunteer joined response',v.name+' assigned to '+incId+'.');
  save();return true;
}
function escalate(incId){
  const inc=getInc(incId);if(!inc||inc.status==='RESOLVED')return;
  inc.score=clamp(inc.score+12,5,100);inc.priority=classOf(inc.score);
  pushTL(inc,'Incident escalated by command center — priority now '+inc.priority);
  notif('critical','Incident escalated',incId+' escalated to '+inc.priority+' (score '+inc.score+').');
  save();
}

    return [['/command','Overview','grid'],['/incidents','Incidents','alert',String(S.incidents.length)],['/map','Emergency Map','pin',crit?String(crit):''],['/teams','Rescue Teams','helmet',dep?String(dep):''],['/resources','Resources','box'],['/shelters','Shelters','home'],['/volunteers','Volunteers','heart'],['/analytics','Analytics','chart']];

const dashMetrics=()=>{
  const act=activeIncs(),crit=act.filter(i=>i.priority==='CRITICAL');
  const dep=S.teams.filter(t=>t.avail==='DEPLOYED').length;
  const res=S.resources.reduce((a,r)=>a+r.available,0);
  const occ=Math.round(S.shelters.reduce((a,s)=>a+s.occ/s.cap*100,0)/S.shelters.length);
  return `<div class="metrics">
    ${stat('ACTIVE INCIDENTS',act.length,'alert','blue')}
    ${stat('CRITICAL',crit.length,'zap','red')}
    ${stat('TEAMS DEPLOYED',dep,'helmet','orange')}
    ${stat('RESOURCE UNITS',res,'box','teal')}
    ${stat('SHELTER OCCUPANCY',occ,'home','yellow','%')}
    ${stat('RESOLVED TODAY',S.resolvedToday,'check','green')}
  </div>`;
};

  const pmix=['CRITICAL','HIGH','MEDIUM','LOW'].map(p=>({p,n:S.incidents.filter(i=>i.priority===p&&i.status!=='RESOLVED').length}));
  const mx=Math.max(...pmix.map(x=>x.n),1);
  return `${dashMetrics()}
  <div class="dash-grid">

function filteredIncs(){
  const f=UI.f;let l=[...S.incidents];
  if(f.tab==='CRITICAL'||f.tab==='HIGH')l=l.filter(i=>i.priority===f.tab);
  else if(f.tab==='ACTIVE')l=l.filter(i=>i.status!=='RESOLVED');
  else if(f.tab==='ASSIGNED')l=l.filter(i=>i.team&&i.status!=='RESOLVED');
  else if(f.tab==='RESOLVED')l=l.filter(i=>i.status==='RESOLVED');
  if(f.pr)l=l.filter(i=>i.priority===f.pr);
  if(f.ty)l=l.filter(i=>i.type===f.ty);
  if(f.q){const q=f.q.toLowerCase();l=l.filter(i=>(i.id+' '+i.type+' '+i.location+' '+i.name).toLowerCase().includes(q));}
  return l.sort((a,b)=>b.score-a.score);
}

function analyticsData(){
  const types={};S.incidents.forEach(i=>types[i.type]=(types[i.type]||0)+1);
  const pal=['red','orange','yellow','blue','green','teal'];
  const byType=Object.entries(types).map(([l,v],i)=>({l,v,c:pal[i%pal.length]}));
  const pri=['CRITICAL','HIGH','MEDIUM','LOW'].map((p,i)=>({l:p,v:S.incidents.filter(x=>x.priority===p).length,c:['red','orange','yellow','blue'][i]})).filter(x=>x.v);
  const resolvedAll=S.hist.resolved+S.resolvedToday,rate=Math.round(resolvedAll/(resolvedAll+activeIncs().length)*100);
  const util=Math.round(S.teams.filter(t=>t.avail==='DEPLOYED').length/S.teams.length*100);
  const people=S.hist.people+S.incidents.filter(i=>i.status==='RESOLVED').reduce((a,i)=>a+i.people,0);
  return {byType,pri,rate,util,people,week:S.week};
}
function lineChart(vals){
  const w=340,h=120,p=10,mx=Math.max(...vals),n=vals.length;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(n-1),h-p-(v/mx)*(h-2*p)]);
  const d=pts.map((pt,i)=>(i?'L':'M')+pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h+22}" style="width:100%">
    <path d="${d} L${pts[n-1][0]},${h-p} L${pts[0][0]},${h-p} Z" fill="rgba(77,159,255,.09)"/>
    <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round"/>
    ${pts.map(pt=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="3" fill="var(--blue)"/>`).join('')}
    ${['MON','TUE','WED','THU','FRI','SAT','TODAY'].map((l,i)=>`<text x="${p+i*(w-2*p)/(n-1)}" y="${h+14}" text-anchor="middle" fill="#5C6D8E" font-family="JetBrains Mono" font-size="8.5">${l}</text>`).join('')}
  </svg>`;
}
function hbar(items){
  const mx=Math.max(...items.map(i=>i.v),1);
  return `<div class="hbar">${items.map(i=>`<div class="hrow"><span class="hl">${esc(i.l)}</span><div class="htrack"><i style="width:${i.v/mx*100}%;background:var(--${i.c})"></i></div><span class="hv mono">${i.v}</span></div>`).join('')}</div>`;
}
function donut(items){
  const tot=items.reduce((a,b)=>a+b.v,0)||1,C=2*Math.PI*40;let acc=0;
  const segs=items.map(i=>{const len=i.v/tot*C,s=`<circle cx="60" cy="60" r="40" fill="none" stroke="var(--${i.c})" stroke-width="15" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(C/4-acc).toFixed(2)}"><title>${esc(i.l)}: ${i.v}</title></circle>`;acc+=len;return s;}).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" class="donut">${segs}<circle cx="60" cy="60" r="31" fill="var(--surface)"/></svg>
  <div class="dleg">${items.map(i=>`<div><i style="background:var(--${i.c})"></i>${esc(i.l)} <b class="mono" style="color:var(--text)">${i.v}</b></div>`).join('')}</div></div>`;
}

/* ---------------- ROUTER ---------------- */
function navGuard(base){
  if(['command','incidents','incident','map','teams','resources','volunteers','analytics'].includes(base)&&S.role!=='command')S.role='command';
  if(['citizen','track','alerts','sos'].includes(base)&&!['citizen','team','volunteer','shelter','command'].includes(S.role))S.role='citizen';
  if(base==='team')S.role='team';if(base==='vol')S.role='volunteer';if(base==='shelterc')S.role='shelter';
}
function render(){
  const h=location.hash.replace(/^#\/?/,''),parts=h.split('/').filter(Boolean);
  const base=parts[0]||'',param=parts[1]||'';
  if(base!=='roles'&&base!=='')navGuard(base);
  RM=RM0||S.prefs.rm;
  /* SOS re-entry: starting a fresh SOS after a previous one resets the wizard (keeps contact info) */
  if(base==='sos'&&UI.lastRoute!=='sos'&&(UI.sos.done||UI.sos.step===4)){
    UI.sos={step:1,type:null,phase:'scan',done:null,form:UI.sos.form};
  }
  const app=$('#app');let html='',mount=null;
  switch(base){
    case '':html=viewLanding();mount=mountLanding;break;
    case 'roles':html=viewRoles();mount=()=>pageIn();break;
    case 'citizen':html=viewCitizen();mount=()=>pageIn();break;
    case 'sos':html=viewSOS();mount=mountSOS;break;
    case 'track':html=viewTrack();mount=()=>pageIn();break;
    case 'alerts':html=viewAlerts();mount=()=>pageIn();break;
    case 'shelters':html=(S.role==='citizen')
        ? citizenNav('shelters')+`<div class="cit-main">${viewShelters()}</div>`
        : shellHTML('Shelters',viewShelters(),'/shelters');
      mount=()=>pageIn();break;
    case 'command':html=shellHTML('Command Dashboard',viewCommand(),'/command');mount=()=>pageIn();break;
    case 'map':html=shellHTML('Emergency Map',viewMapPage(),'/map');mount=()=>pageIn();break;
    case 'incidents':html=shellHTML('Incidents',viewIncidents(),'/incidents');mount=()=>pageIn();break;
    case 'incident':html=shellHTML('Incident '+param,viewIncident(param),'/incidents');mount=()=>{pageIn();mountIncident(param);};break;
    case 'teams':html=shellHTML('Rescue Teams',viewTeams(),'/teams');mount=()=>pageIn();break;
    case 'resources':html=shellHTML('Resources',viewResources(),'/resources');mount=()=>pageIn();break;
    case 'volunteers':html=shellHTML('Volunteers',viewVolunteers(),'/volunteers');mount=()=>pageIn();break;
    case 'analytics':html=shellHTML('Analytics',viewAnalytics(),'/analytics');mount=()=>pageIn();break;
    case 'settings':html=shellHTML('Settings & Demo',viewSettings(),'/settings');mount=()=>pageIn();break;
    case 'team':html=shellHTML('My Mission',viewTeam(),'/team');mount=()=>pageIn();break;
    case 'vol':html=shellHTML('Volunteer Desk',viewVol(),'/vol');mount=()=>pageIn();break;
    case 'shelterc':html=shellHTML('Shelter Ops',viewShelterC(),'/shelterc');mount=()=>pageIn();break;
    default:html=viewLanding();mount=mountLanding;
  }
  app.innerHTML=html+demoBarHTML();
  if(mount)mount();
  counters();
  updateBell();tickClock();
  document.body.classList.toggle('demo-on',S.demo.running||S.demo.done);
  window.scrollTo(0,0);
  const c=$('#content');if(c)c.scrollTop=0;
  document.body.classList.remove('nav-open');
  UI.lastRoute=base||'landing';
}
function mountLanding(){
  pageIn();
  ani({targets:'#hubSvg line',strokeDashoffset:[anime.setDashoffset,0],duration:1400,delay:anime.stagger(130),easing:'easeInOutSine'});
  ani({targets:'#hubSvg .hn',scale:[0,1],opacity:[0,1],duration:650,delay:anime.stagger(110,{start:450}),easing:'easeOutBack'});
  if(!RM){
    ani({targets:'#hubSvg .hn-f',translateY:[-4,4],duration:2600,direction:'alternate',loop:true,easing:'easeInOutSine',delay:anime.stagger(220)});
    ani({targets:'.loopRing',strokeDashoffset:[anime.setDashoffset,0],rotate:[0,360],duration:6400,loop:true,easing:'linear'});
  }
}
function mountIncident(id){
  const inc=getInc(id),big=$('#scoreBig');
  if(big&&inc)ani({targets:big,innerText:[0,inc.score],round:1,duration:900,easing:'easeOutExpo'});
}
let sosScanTimer=null;
function mountSOS(){
  const st=UI.sos;
  pageIn();
  if(st.step===3&&st.phase==='scan'){
    ani({targets:'#scanline',top:['0%','100%'],duration:900,loop:true,easing:'easeInOutSine'});
    clearTimeout(sosScanTimer);
    sosScanTimer=setTimeout(()=>{
      if(UI.sos.step===3&&UI.sos.phase==='scan'&&location.hash.replace(/^#\/?/,'').startsWith('sos')){
        UI.sos.phase='result';render();
      }
    },1700);
  }
  if(st.step===3&&st.phase==='result'){
    const a=st.assess;
    ani({targets:'#scoreNum',innerText:[0,a.score],round:1,duration:1100,easing:'easeOutExpo'});
    ani({targets:'#scoreBar',width:a.score+'%',duration:1100,easing:'easeOutExpo'});
    ani({targets:'#priWord',scale:[.7,1],opacity:[0,1],duration:520,easing:'easeOutBack'});
    ani({targets:'.insight,.factor',opacity:[0,1],translateY:[8,0],duration:400,delay:anime.stagger(50,{start:300}),easing:'easeOutQuad'});
  }
  if(st.step===4){
    const p=$('#succCheck path');
    if(p)ani({targets:p,strokeDashoffset:[anime.setDashoffset,0],duration:600,easing:'easeOutCubic'});
    ani({targets:'.succ-check',scale:[.6,1],opacity:[0,1],duration:520,easing:'easeOutBack'});
    ani({targets:'.req-id',opacity:[0,1],translateY:[8,0],duration:450,delay:250,easing:'easeOutCubic'});
  }
}

  if(S.demo.running||S.demo.done)return;
  S.demo.running=true;S.demo.idx=0;save();
  const data={mode:'sos',type:'Flood',name:'Aisha Rahman',contact:'555-0142',location:'Riverside Sector · Block D',people:6,injuries:'severe',danger:'extreme',trapped:true,vulnerable:true,desc:'DEMO — Floodwater surrounding a two-storey home. Six residents on the upper floor, water still rising. Elderly grandmother cannot use stairs.',notes:'Access via back lane only.'};
  const tour=['/track','/track','/command','/command','/command','/command','/teams','/resources','/track','/track','/incidents','/shelters','/analytics'];
  const step=(i,fn)=>{demoT.push(setTimeout(()=>{ if(!S.demo.running)return; fn(); S.demo.idx=i; save(); const r=tour[i-1]; if(r)go(r); else render(); },i*2500+700));};
  step(1,()=>{const inc=createIncident(data);UI.demoId=inc.id;UI.trackId=inc.id;});
  step(2,()=>setStatus(UI.demoId,'UNDER REVIEW'));
  step(3,()=>setStatus(UI.demoId,'PRIORITY ASSESSED'));
  step(4,()=>{notif('critical','Critical queue updated',UI.demoId+' entered the top of the priority queue (score '+getInc(UI.demoId).score+').');save();});
  step(5,()=>{notif('info','Decision support reviewed','Command reviewed priority insights for '+UI.demoId+'.');save();});
  step(6,()=>{const t=S.teams.find(x=>x.avail==='AVAILABLE'&&x.spec.includes('Water'))||S.teams.find(x=>x.avail==='AVAILABLE');if(t)assignTeam(UI.demoId,t.id);});
  step(7,()=>{const inc=getInc(UI.demoId);if(inc&&inc.team){const t=getTeam(inc.team);if(t)notif('info','Team deployed',t.name+' status: DEPLOYED.');}save();});
  step(8,()=>{allocateResource(UI.demoId,'R1',60);allocateResource(UI.demoId,'R2',8);});
  step(9,()=>{notif('success','Citizen update pushed','Tracking page reflects every change in real time.');save();});
  step(10,()=>setStatus(UI.demoId,'EN ROUTE'));
  step(11,()=>setStatus(UI.demoId,'RESCUE IN PROGRESS'));
  step(12,()=>{const inc=getInc(UI.demoId);assignEvacuees('S1',inc?inc.people:6,UI.demoId);setStatus(UI.demoId,'EVACUATED');});
  step(13,()=>setStatus(UI.demoId,'RESOLVED'));
  demoT.push(setTimeout(()=>{ if(!S.demo.running)return; S.demo.running=false;S.demo.done=true;notif('success','Demo scenario complete','From SOS to Safe — every stage of the closed loop was demonstrated.');save();render();},14*2500+900));
}
function stopDemo(){demoT.forEach(clearTimeout);demoT=[];S.demo.running=false;S.demo.idx=0;save();render();toast('Demo scenario stopped.','t-blue');}

/* ---------------- ACTIONS ---------------- */
const ACTIONS={
  go:(id,el)=>go(el.dataset.to),
  scrollTo:(id,el)=>{const t=document.getElementById(el.dataset.to);if(t)t.scrollIntoView({behavior:RM?'auto':'smooth'});},
  nav:()=>document.body.classList.toggle('nav-open'),
  pickRole:(id,el)=>{S.role=el.dataset.role;save();go(roleHome(S.role));toast('Entering as <b>'+esc(el.querySelector('h3').textContent)+'</b>','t-green');},
  openDrawer:()=>openDrawer(),closeDrawer:()=>closeDrawer(),
  markRead:(id,el)=>{const n=S.notifications.find(x=>x.id===el.dataset.id);if(n){n.read=true;save();el.classList.remove('unread');updateBell();}},
  markAllRead:()=>{S.notifications.forEach(n=>n.read=true);save();const d=$('#drawer');if(d){d.remove();const o=$('#drawerOv');if(o)o.remove();}openDrawer();updateBell();},
  clearNotifs:()=>{S.notifications=[];save();closeDrawer(true);openDrawer();updateBell();},
  selInc:(id,el)=>selectIncident(el.dataset.id),
  deselInc:()=>selectIncident(null),
  selTeam:(id,el)=>{const t=getTeam(el.dataset.id);if(!t)return;if(t.mission&&getInc(t.mission))selectIncident(t.mission);else toast(esc(t.name)+' is standing by at '+esc(t.loc),'t-blue');},
  selShelter:(id,el)=>{const sh=getShelter(el.dataset.id);if(sh)toast(esc(sh.name)+' — occupancy '+sh.occ+'/'+sh.cap,'t-blue');},
  incTab:(id,el)=>{UI.f.tab=el.dataset.id;$$('.tab').forEach(t=>t.classList.toggle('active',t===el));const l=$('#incList');if(l)l.innerHTML=incListHTML();},
  assignOpen:incId=>{const inc=getInc(incId||UI.sel);if(!inc)return;
    const av=S.teams.filter(t=>t.avail==='AVAILABLE');
    openModal(`<h3>Assign response team</h3><p class="msub">${inc.id} · ${esc(inc.type)} · ${inc.priority} — nearest suitable unit will be marked.</p>
    ${av.length?av.map(t=>`<div class="queue-item" data-act="assignDo" data-id="${t.id}" data-rid="${inc.id}">
      <div class="stat-ic c-blue" style="width:36px;height:36px">${ico('helmet',16)}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${esc(t.name)}</div><div class="ql">${esc(t.spec)} · ${esc(t.loc)} · ${t.cap} members</div></div>
      ${inc.type.includes(t.spec.split(' ')[0])?'<span class="badge b-green"><i></i>BEST MATCH</span>':''}
    </div>`).join(''):`<div class="empty"><div class="ic">${ico('helmet',20)}</div>All teams are currently deployed.<br><span class="faint" style="font-size:12.5px">Resolve an incident to release a team, or escalate for mutual aid.</span></div>`}
    <button class="btn btn-ghost sm" data-act="closeModal" style="margin-top:8px">Cancel</button>`);},
  assignDo:(id,el)=>{const btn=el;btn.style.pointerEvents='none';btn.innerHTML='<span class="spin"></span> Assigning optimal team…';
    setTimeout(()=>{assignTeam(el.dataset.rid,el.dataset.id);closeModal();UI.sel=el.dataset.rid;render();toast(getTeam(el.dataset.id)?.name+' deployed to <b>'+el.dataset.rid+'</b>','t-green');},750);},
  allocOpen:id=>{
    let incId=null;
    if(S.incidents.some(i=>i.id===id))incId=id;
    const act=activeIncs();
    if(!act.length){openModal(`<h3>Allocate resources</h3><div class="empty"><div class="ic">${ico('box',20)}</div>No active incidents right now.<br><span class="faint" style="font-size:12.5px">Resources can be allocated once an emergency request exists.</span></div><button class="btn btn-ghost sm" data-act="closeModal" style="margin-top:8px">Close</button>`);return;}
    openModal(`<h3>Allocate resources</h3><p class="msub">Select an active incident, a resource and quantity. Availability updates network-wide.</p>
    <div class="fgrid">
      <div class="fg"><label>Incident</label><select class="inp" id="alInc">${act.map(i=>`<option value="${i.id}" ${incId===i.id?'selected':''}>${i.id} · ${esc(i.type)} (${i.priority})</option>`).join('')}</select></div>
      <div class="fg"><label>Resource</label><select class="inp" id="alRes">${S.resources.map(r=>`<option value="${r.id}" ${id===r.id?'selected':''}>${r.name} — ${r.available} ${r.unit} available</option>`).join('')}</select></div>
      <div class="fg"><label>Quantity</label><input class="inp" id="alQty" type="number" min="1" value="10"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end">
      <button class="btn btn-ghost" data-act="closeModal">Cancel</button>
      <button class="btn btn-primary" data-act="allocDo">${ico('send',14)} Confirm allocation</button></div>`);},
  allocDo:()=>{
    const incId=$('#alInc')?.value,resId=$('#alRes')?.value,qty=+($('#alQty')?.value||0);
    const r=S.resources.find(x=>x.id===resId);
    if(!incId){toast('Select an incident.','t-red');return;}
    if(!qty||qty<1){toast('Enter a valid quantity.','t-red');return;}
    if(r&&qty>r.available){toast('Only '+r.available+' '+r.unit+' available.','t-red');return;}
    if(allocateResource(incId,resId,qty)){closeModal();render();toast(qty+' units allocated to <b>'+incId+'</b>','t-green');}
  },
  shelterOpen:incId=>{const inc=getInc(incId||UI.sel);if(!inc)return;
    const free=S.shelters.filter(s=>s.occ<s.cap);
    openModal(`<h3>Assign shelter</h3><p class="msub">Move up to ${inc.people} evacuees from ${inc.id} into a shelter with free space.</p>
    ${free.length?`<div class="fg"><label>Shelter</label><select class="inp" id="shSel">${free.map(s=>`<option value="${s.id}">${esc(s.name)} — ${s.cap-s.occ} spaces (${s.occ}/${s.cap})</option>`).join('')}</select></div>
    <div class="fg" style="margin-top:12px"><label>Evacuees</label><input class="inp" id="shQty" type="number" min="1" max="${inc.people}" value="${inc.people}"></div>
    <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end"><button class="btn btn-ghost" data-act="closeModal">Cancel</button>
    <button class="btn btn-primary" data-act="shelterDo" data-id="${inc.id}">${ico('home',14)} Confirm transfer</button></div>`:
    `<div class="empty"><div class="ic">${ico('home',20)}</div>All shelters are at full capacity.</div><button class="btn btn-ghost sm" data-act="closeModal" style="margin-top:8px">Close</button>`}`);},
  shelterDo:(id,el)=>{const n=+($('#shQty')?.value||0);
    if(!n||n<1){toast('Enter a valid number of evacuees.','t-red');return;}
    if(assignEvacuees($('#shSel').value,n,el.dataset.id)){closeModal();UI.sel=el.dataset.id;render();toast(n+' evacuees moved to shelter','t-green');}},
  evacOpen:id=>{const sh=getShelter(id);if(!sh)return;
    openModal(`<h3>Assign evacuees — ${esc(sh.name)}</h3><p class="msub">${sh.cap-sh.occ} spaces available. Capacity is enforced — over-allocation is blocked.</p>
    <div class="fg"><label>Number of evacuees</label><input class="inp" id="evQty" type="number" min="1" max="${Math.max(1,sh.cap-sh.occ)}" value="${Math.min(10,sh.cap-sh.occ)}"></div>
    <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end"><button class="btn btn-ghost" data-act="closeModal">Cancel</button>
    <button class="btn btn-primary" data-act="evacDo" data-id="${sh.id}">${ico('users',14)} Check in</button></div>`);},
  evacDo:(id,el)=>{const n=+($('#evQty')?.value||0);
    if(!n||n<1){toast('Enter a valid number.','t-red');return;}
    if(assignEvacuees(el.dataset.id,n)){closeModal();render();toast(n+' evacuees checked in','t-green');}},
  advStatus:(id,el)=>{const inc=getInc(id||UI.sel);if(!inc)return;
    const ns=nextStatus(inc);
    if(ns==='TEAM ASSIGNED'&&!inc.team){toast('Assign a team first.','t-red');return;}
    setStatus(inc.id,ns);UI.sel=inc.id;render();
    toast('<b>'+inc.id+'</b> → '+ns,'t-blue');},
  resolve:(id,el)=>{const inc=getInc(id||UI.sel);if(!inc)return;
    setStatus(inc.id,'RESOLVED');UI.sel=inc.id;render();toast('<b>'+inc.id+'</b> resolved — loop closed','t-green');},
  escalate:(id,el)=>{const inc=getInc(id||UI.sel);if(!inc)return;escalate(inc.id);UI.sel=inc.id;render();toast('Incident escalated to <b>'+inc.priority+'</b>','t-red');},
  dispatchOpen:id=>{const t=getTeam(id);if(!t)return;
    const open=activeIncs().filter(i=>!i.team);
    openModal(`<h3>Dispatch ${esc(t.name)}</h3><p class="msub">${esc(t.spec)} · ${t.cap} members · ${esc(t.loc)}</p>
    ${open.length?open.map(i=>`<div class="queue-item" data-act="dispatchDo" data-id="${t.id}" data-rid="${i.id}">
      <div class="stat-ic c-${i.priority==='CRITICAL'?'red':'orange'}" style="width:36px;height:36px">${typeIcon(i.type,15)}</div>
      <div style="flex:1"><div class="qid">${i.id} · ${esc(i.type)}</div><div class="ql">${esc(i.location)} · ${i.priority} (${i.score})</div></div></div>`).join(''):
    `<div class="empty"><div class="ic">${ico('check',20)}</div>No unassigned active incidents.<br><span class="faint" style="font-size:12.5px">All available teams are currently displayed.</span></div>`}
    <button class="btn btn-ghost sm" data-act="closeModal" style="margin-top:8px">Cancel</button>`);},
  dispatchDo:(id,el)=>{assignTeam(el.dataset.rid,el.dataset.id);closeModal();render();toast(getTeam(el.dataset.id)?.name+' deployed to <b>'+el.dataset.rid+'</b>','t-green');},
  volOpen:incId=>{const inc=getInc(incId);if(!inc)return;
    const av=S.volunteers.filter(v=>v.avail==='AVAILABLE');
    const skills=TYPE_SKILLS[inc.type]||[];
    openModal(`<h3>Assign volunteers</h3><p class="msub">${inc.id} · ${esc(inc.type)} — skill-matched volunteers are highlighted.</p>
    ${av.length?av.map(v=>`<div class="queue-item" data-act="volDo" data-id="${v.id}" data-rid="${incId}">
      <div class="stat-ic c-teal" style="width:36px;height:36px">${ico('heart',15)}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${esc(v.name)}</div><div class="ql">${v.skills.join(', ')} · ${esc(v.loc)}</div></div>
      ${v.skills.some(s=>skills.includes(s))?'<span class="badge b-green"><i></i>SKILL MATCH</span>':''}</div>`).join(''):
    `<div class="empty"><div class="ic">${ico('heart',20)}</div>No volunteers available right now.</div>`}
    <button class="btn btn-ghost sm" data-act="closeModal" style="margin-top:8px">Cancel</button>`);},
  volDo:(id,el)=>{if(joinResponse(el.dataset.id,el.dataset.rid)){closeModal();render();toast('Volunteer joined the response','t-green');}},
  joinSelf:(id,el)=>{if(joinResponse('V2',el.dataset.id)){render();toast('You joined <b>'+el.dataset.id+'</b> — command notified','t-green');}},
  sosPick:(id,el)=>{UI.sos.type=el.dataset.id;$$('.cat').forEach(c=>c.classList.toggle('sel',c===el));const b=$('[data-act="sosNext"]');if(b)b.disabled=false;},
  sosNext:()=>{UI.sos.step=2;render();},
  sosBack:()=>{UI.sos.step=Math.max(1,UI.sos.step-1);if(UI.sos.step<3)UI.sos.phase='scan';render();},
  sosAssess:()=>{
    const name=($('#f_name')?.value||'').trim(),loc=($('#f_loc')?.value||'').trim();
    if(!name||!loc){toast('Name and location are required to route help.','t-red');return;}
    UI.sos.form={name,phone:$('#f_phone')?.value||'',loc,people:clamp(+$('#f_people').value||1,1,99),injury:$('#f_injury')?.value||'none',danger:$('#f_danger')?.value||'low',trapped:!!($('#f_trapped')?.checked),vuln:!!($('#f_vuln')?.checked),notes:$('#f_notes')?.value||''};
    const d={mode:'sos',type:UI.sos.type||'Other',name,contact:UI.sos.form.phone,location:loc,people:UI.sos.form.people,injuries:UI.sos.form.injury,danger:UI.sos.form.danger,trapped:UI.sos.form.trapped,vulnerable:UI.sos.form.vuln,desc:UI.sos.form.notes};
    UI.sos.assess={...calcPriority(d),d};
    UI.sos.step=3;UI.sos.phase='scan';render();},
  sosSubmit:()=>{
    const a=UI.sos.assess;if(!a)return;
    const inc=createIncident({...a.d,mode:'sos'});
    UI.sos.done=inc.id;UI.trackId=inc.id;UI.sos.step=4;save();render();
    toast('Emergency request <b>'+inc.id+'</b> received','t-green');},
  trackSel:(id,el)=>{UI.trackId=el.dataset.id;render();},
  directions:(id,el)=>toast('Route to <b>'+esc(el.dataset.id)+'</b> copied to navigation (simulated)','t-blue'),
  teamAdv:(id,el)=>{setStatus(el.dataset.id,el.dataset.to);render();toast('Status updated → <b>'+el.dataset.to+'</b>','t-blue');},
  teamEvac:id=>{const inc=getInc(id);if(!inc)return;
    if(assignEvacuees('S1',inc.people,inc.id)){setStatus(inc.id,'EVACUATED');render();toast(inc.people+' evacuees moved to Central Community Hub','t-green');}},
  shCheckin:()=>{const n=+($('#evN')?.value||0);if(n>0&&assignEvacuees('S1',n)){render();toast(n+' evacuees checked in','t-green');}},
  acceptTransfer:()=>{if(assignEvacuees('S1',12)){render();toast('Transfer accepted — 12 evacuees arriving','t-green');}},
  demoRun:()=>{runDemo();render();},
  demoStop:()=>stopDemo(),
  demoDismiss:()=>{S.demo.done=false;S.demo.idx=0;save();render();},
  resetConfirm:()=>openModal(`<h3>Reset demo data?</h3><p class="msub">All incidents, assignments, allocations and notifications created during this session will be replaced with the original realistic mock dataset. This cannot be undone.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn btn-ghost" data-act="closeModal">Cancel</button>
    <button class="btn btn-danger" data-act="resetDo">${ico('refresh',14)} Reset everything</button></div>`),
  resetDo:()=>resetData(),
  toggleRM:()=>{S.prefs.rm=!S.prefs.rm;save();render();toast('Reduced motion '+(S.prefs.rm?'enabled':'disabled'),'t-blue');},
  closeModal:()=>closeModal()
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const fn=ACTIONS[el.dataset.act];
  if(fn)fn(el.dataset.id,el,e);
});
/* Keyboard activation for non-button interactive elements (e.g., category tiles) */
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target instanceof Element&&e.target.matches('[data-act][role="button"]')){
    e.preventDefault();e.target.click();
  }
  if(e.key==='Escape'){closeModal();closeDrawer();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='incSearch'){UI.f.q=e.target.value;const l=$('#incList');if(l)l.innerHTML=incListHTML();}
});
document.addEventListener('change',e=>{
  if(e.target.id==='fPr')UI.f.pr=e.target.value;
  if(e.target.id==='fTy')UI.f.ty=e.target.value;
  if(e.target.id==='fPr'||e.target.id==='fTy'){const l=$('#incList');if(l)l.innerHTML=incListHTML();}
});

/* ---------------- ROUTER PLUMBING ---------------- */
function go(p){const t='#'+p;if(location.hash===t)render();else location.hash=t;}
window.addEventListener('hashchange',render);
function tickClock(){const c=$('#clock');if(c)c.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
setInterval(tickClock,1000);

/* ---------------- BOOT ---------------- */
S=load();
if(!location.hash)location.hash='#/';
render();
</script>
